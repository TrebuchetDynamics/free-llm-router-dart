name: test

on:
  push:
  pull_request:

jobs:
  dart-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Dart
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - name: Dependencies
        run: dart pub get
      - name: Format
        run: dart format --set-exit-if-changed bin example lib test
      - name: Analyze
        run: dart analyze
      - name: Test
        run: dart test
      - name: CLI smoke
        run: dart run free_llm_router list
      - name: Executable metadata smoke
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          export PUB_CACHE="$tmp/pub-cache"
          dart pub global activate --source path .
          export PATH="$PUB_CACHE/bin:$PATH"
          free_llm_router list | tee "$tmp/list.txt"
          grep -q pollinationsai "$tmp/list.txt"
